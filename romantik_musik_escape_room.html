<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Escape Room – Musik der Romantik</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0a1a;color:#e8d5a3;font-family:'EB Garamond',serif;min-height:100vh;overflow-x:hidden}
:root{
  --gold:#c9a84c;--gold-light:#e8d5a3;--gold-dim:#8a6a2a;
  --deep:#0d0a1a;--navy:#1a1530;--purple:#2a1f4a;
  --success:#4a7c59;--error:#7c3a3a;
}
.wrap{max-width:780px;margin:0 auto;padding:16px;min-height:100vh;display:flex;flex-direction:column}

/* PROGRESS */
.prog{display:flex;align-items:center;gap:8px;margin-bottom:20px;padding:12px 16px;background:rgba(26,21,48,0.8);border:1px solid var(--gold-dim);border-radius:12px}
.prog-label{font-family:'Cinzel',serif;font-size:11px;color:var(--gold-dim);text-transform:uppercase;letter-spacing:2px;white-space:nowrap}
.dots{display:flex;gap:8px;flex:1;justify-content:center}
.dot{width:32px;height:32px;border-radius:50%;border:2px solid var(--gold-dim);display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:11px;color:var(--gold-dim);transition:all 0.4s;flex-shrink:0}
.dot.done{background:var(--gold);border-color:var(--gold);color:var(--deep)}
.dot.active{background:rgba(201,168,76,0.2);border-color:var(--gold);color:var(--gold);box-shadow:0 0 12px rgba(201,168,76,0.4)}

/* CARD */
.card{background:linear-gradient(160deg,#1a1530 0%,#0f0c20 100%);border:1px solid var(--gold-dim);border-radius:16px;padding:28px;position:relative;overflow:hidden;margin-bottom:16px}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.card-deco{position:absolute;top:12px;right:16px;font-size:32px;opacity:0.08}

/* TYPE */
h1{font-family:'Cinzel',serif;font-size:26px;font-weight:700;color:var(--gold);line-height:1.2;margin-bottom:8px;text-shadow:0 0 20px rgba(201,168,76,0.3)}
h2{font-family:'Cinzel',serif;font-size:20px;font-weight:600;color:var(--gold);margin-bottom:12px}
h3{font-family:'Cinzel',serif;font-size:15px;font-weight:400;color:var(--gold-light);margin-bottom:10px;line-height:1.5}
p{font-size:16px;line-height:1.7;color:var(--gold-light);margin-bottom:12px}
.muted{color:#9a8a6a;font-size:13px}
.badge{display:inline-block;background:rgba(201,168,76,0.12);border:1px solid var(--gold-dim);border-radius:20px;padding:3px 12px;font-family:'Cinzel',serif;font-size:11px;color:var(--gold-dim);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}

/* MAESTRO */
.maestro{display:flex;gap:14px;background:rgba(42,31,74,0.6);border:1px solid rgba(201,168,76,0.25);border-radius:12px;padding:14px 18px;margin-bottom:20px}
.maestro-av{font-size:36px;line-height:1;flex-shrink:0;margin-top:2px}
.maestro-name{font-family:'Cinzel',serif;font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:4px}
.maestro-txt{font-style:italic;font-size:15px;color:#c8b896;line-height:1.6}

/* BUTTONS */
.btn{display:inline-block;padding:11px 24px;border-radius:8px;font-family:'Cinzel',serif;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s;border:none;letter-spacing:1px;text-align:center}
.btn:active{transform:scale(0.97)}
.btn-gold{background:var(--gold);color:var(--deep)}
.btn-gold:hover{background:#e8c050}
.btn-outline{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn-outline:hover{background:rgba(201,168,76,0.1)}
.btn-sm{padding:7px 14px;font-size:12px}
.btn-full{width:100%;margin-top:10px}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}

/* QUIZ */
.quiz-opts{display:flex;flex-direction:column;gap:8px;margin:16px 0}
.qopt{display:block;width:100%;padding:12px 16px;background:rgba(26,21,48,0.8);border:1px solid rgba(201,168,76,0.3);border-radius:8px;color:var(--gold-light);font-family:'EB Garamond',serif;font-size:15px;cursor:pointer;text-align:left;transition:all 0.2s}
.qopt:hover:not(:disabled){background:rgba(201,168,76,0.1);border-color:var(--gold)}
.qopt.correct{background:rgba(74,124,89,0.3);border-color:#6ab384;color:#a8d8b8}
.qopt.wrong{background:rgba(124,58,58,0.3);border-color:#c47a7a;color:#e8aaaa}
.qopt:disabled{cursor:default}
.fb{padding:12px 16px;border-radius:8px;font-size:15px;line-height:1.6;margin-top:10px}
.fb.ok{background:rgba(74,124,89,0.2);border:1px solid rgba(106,179,132,0.4);color:#a8d8b8}
.fb.err{background:rgba(124,58,58,0.2);border:1px solid rgba(196,122,122,0.4);color:#e8aaaa}

/* SORT */
.sort-list{display:flex;flex-direction:column;gap:8px;margin:16px 0}
.sort-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(26,21,48,0.8);border:1px solid rgba(201,168,76,0.25);border-radius:8px;cursor:grab;user-select:none;color:var(--gold-light);font-size:15px;transition:all 0.15s}
.sort-item:active{cursor:grabbing}
.sort-item.drag-over{border-color:var(--gold);background:rgba(201,168,76,0.1)}
.sort-item.dragging{opacity:0.5}
.sort-handle{color:var(--gold-dim);font-size:18px;flex-shrink:0}
.sort-num{font-family:'Cinzel',serif;font-size:12px;color:var(--gold-dim);min-width:20px}

/* MATCH */
.match-wrap{margin:16px 0}
.match-heads{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.match-head{font-family:'Cinzel',serif;font-size:11px;color:var(--gold-dim);letter-spacing:2px;text-transform:uppercase;text-align:center;padding:4px 0}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match-item{padding:10px 12px;background:rgba(26,21,48,0.8);border:1px solid rgba(201,168,76,0.25);border-radius:8px;cursor:pointer;font-size:14px;text-align:center;transition:all 0.2s;color:var(--gold-light);min-height:48px;display:flex;align-items:center;justify-content:center;line-height:1.3}
.match-item:hover{border-color:var(--gold);background:rgba(201,168,76,0.08)}
.match-item.sel{border-color:var(--gold);background:rgba(201,168,76,0.18);color:var(--gold)}
.match-item.ok{border-color:#6ab384;background:rgba(74,124,89,0.25);color:#a8d8b8;cursor:default}
.match-item.bad{border-color:#c47a7a;background:rgba(124,58,58,0.25);color:#e8aaaa;animation:shake 0.3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* HOTSPOT */
.hotspot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.hcell{aspect-ratio:1;background:rgba(26,21,48,0.8);border:1px solid rgba(201,168,76,0.2);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:28px;transition:all 0.2s;padding:6px}
.hcell:hover{border-color:var(--gold);background:rgba(201,168,76,0.08)}
.hcell.sel{border-color:var(--gold);background:rgba(201,168,76,0.15);box-shadow:0 0 16px rgba(201,168,76,0.2)}
.hcell.ok{border-color:#6ab384;background:rgba(74,124,89,0.25)}
.hcell.bad{border-color:#c47a7a;background:rgba(124,58,58,0.25)}
.hlabel{font-size:10px;font-family:'Cinzel',serif;color:var(--gold-dim);margin-top:4px;text-align:center;line-height:1.2}

/* SCENARIO */
.scen-list{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.sopt{padding:14px 18px;background:rgba(26,21,48,0.8);border:1px solid rgba(201,168,76,0.25);border-radius:10px;cursor:pointer;transition:all 0.2s}
.sopt:hover{border-color:var(--gold);background:rgba(201,168,76,0.08)}
.sopt.best{border-color:#6ab384;background:rgba(74,124,89,0.2)}
.sopt.bad{border-color:#c47a7a;background:rgba(124,58,58,0.2)}
.sopt-title{font-family:'Cinzel',serif;font-size:14px;color:var(--gold);margin-bottom:4px}
.sopt-desc{font-size:14px;color:#9a8a6a;line-height:1.5}

/* PASSWORD */
.pw-wrap{text-align:center;margin:20px 0}
.pw-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.pw-l{width:42px;height:52px;background:rgba(26,21,48,0.9);border:1px solid var(--gold-dim);border-radius:6px;font-family:'Cinzel',serif;font-size:22px;font-weight:700;text-align:center;color:var(--gold);outline:none;transition:all 0.2s;text-transform:uppercase;caret-color:var(--gold)}
.pw-l:focus{border-color:var(--gold);box-shadow:0 0 12px rgba(201,168,76,0.3)}
.pw-hint{background:rgba(42,31,74,0.5);border:1px solid rgba(201,168,76,0.2);border-radius:8px;padding:10px 16px;font-style:italic;font-size:14px;color:#9a8a6a;margin-top:12px;display:none}
.pw-hint.show{display:block}
.pw-err{color:#e8aaaa;font-size:14px;margin-top:8px}
.pw-ok{color:#a8d8b8;font-size:14px;margin-top:8px}

/* ORNAMENT */
.orn{text-align:center;color:var(--gold-dim);font-size:18px;margin:16px 0;letter-spacing:8px}

/* CHARS */
.char-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.char-card{background:rgba(42,31,74,0.4);border:1px solid rgba(201,168,76,0.2);border-radius:10px;padding:12px;text-align:center}
.char-emoji{font-size:28px;margin-bottom:6px}
.char-name{font-family:'Cinzel',serif;font-size:13px;color:var(--gold);margin-bottom:4px}
.char-role{font-size:13px;color:#9a8a6a;font-style:italic}

/* FINAL */
.final-icon{font-size:80px;margin:16px 0;display:block;text-align:center;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.final-title{font-family:'Cinzel',serif;font-size:30px;font-weight:700;color:var(--gold);text-align:center;margin-bottom:12px;text-shadow:0 0 30px rgba(201,168,76,0.5)}
.stars{font-size:36px;letter-spacing:8px;text-align:center;margin:12px 0}
.score-badge{display:block;text-align:center;background:rgba(201,168,76,0.15);border:1px solid var(--gold-dim);border-radius:12px;padding:8px 24px;font-family:'Cinzel',serif;font-size:18px;color:var(--gold);margin:8px auto;width:fit-content}
.pw-summary{background:rgba(42,31,74,0.3);border:1px solid rgba(201,168,76,0.2);border-left:3px solid var(--gold);border-radius:10px;padding:16px;margin-top:16px}
.pw-sum-head{font-family:'Cinzel',serif;font-size:11px;color:var(--gold-dim);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px}
.pw-sum-row{font-size:14px;color:var(--gold-light);margin-bottom:4px}
.pw-sum-word{font-family:'Cinzel',serif;color:var(--gold);font-weight:600}

@keyframes flicker{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.85}95%{opacity:1}97%{opacity:.9}}
.glow{animation:flicker 6s infinite}

@media(max-width:520px){
  .match-grid,.match-heads{grid-template-columns:1fr}
  h1{font-size:22px}
  .pw-l{width:34px;height:44px;font-size:17px}
  .hotspot-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
var ROOMS=[
  {id:1,pw:'MOLL',title:'Das verschlossene Archiv',sub:'Grundbegriffe der Romantik',deco:'\u{1F56F}'},
  {id:2,pw:'WAGNER',title:'Das Geheimnis der Partitur',sub:'Formen und Gattungen',deco:'\u{1F3BC}'},
  {id:3,pw:'KUNSTLIED',title:'Die Stunde der Meister',sub:'Komponisten und Werke',deco:'\u{1F319}'},
  {id:4,pw:'BAYREUTH',title:'Das Tor der Oper',sub:'Wagner und sein Werk',deco:'\u{1F3AD}'},
  {id:5,pw:'SINFONIE',title:'Die letzte Probe',sub:'Transfer und Zusammenh\u00E4nge',deco:'\u{1F3C6}'},
];
var S={screen:'intro',room:0,rs:[0,0,0,0,0],step:0,td:{},hints:[0,0,0,0,0],done:[0,0,0,0,0]};
var root=document.getElementById('root');

function maestro(msg){
  return '<div class="maestro"><div class="maestro-av">\u{1F47B}</div><div><div class="maestro-name">Maestro Moritz</div><div class="maestro-txt">'+msg+'</div></div></div>';
}
function prog(){
  var d=ROOMS.map(function(r,i){
    var c=i<S.room?'dot done':(i===S.room?'dot active':'dot');
    return '<div class="'+c+'">'+(i<S.room?'&#10003;':r.id)+'</div>';
  }).join('');
  return '<div class="prog"><span class="prog-label">R&auml;ume</span><div class="dots">'+d+'</div></div>';
}

function r1(){return[
  {type:'sort',
   q:'Sortiere Barock, Klassik und Romantik von alt nach neu.',
   items:['Romantik','Barock','Klassik'],
   c:[1,2,0],
   fb:['Perfekt! Barock \u2192 Klassik \u2192 Romantik. Das Archiv gibt seinen ersten Hinweis frei.','Nicht ganz. Barock beginnt ca. 1600, dann folgt Klassik, und zuletzt die Romantik ab ca. 1800.']},
  {type:'quiz',
   q:'An der Wand steht gro\u00DF: LEIDENSCHAFT! Was unterscheidet die Romantik am st\u00E4rksten von der Klassik?',
   opts:['Strenge Ordnung und symmetrische Formen','Tiefe pers\u00F6nliche Gef\u00FChle, Sehnsucht und Naturbegeisterung','Einfache, klare Melodien f\u00FCr jedermann','Musik nur f\u00FCr den Gottesdienst'],c:1,
   fb:['Das ist eher ein Merkmal der Klassik &#8211; klare Struktur, ausgeglichene Form.','Genau! Die Romantik wendet sich nach innen: Gef\u00FChlsleben, Natur, Fantasie, Sehnsucht. Kunst als Ausdruck der Seele.','Im Gegenteil &#8211; romantische Musik wird komplexer, nicht einfacher.','Kirchenmusik gab es schon l\u00E4nger. Die Romantik ist vor allem weltliche, private Musik.']},
];}

function r2(){return[
  {type:'quiz',
   q:'Ein Notenblatt tr\u00E4gt den Titel \u201ESymphonie Nr. 1\u201C. Was ist eine Symphonie?',
   opts:['Ein kurzes Tanzst\u00FCck f\u00FCr zwei Instrumente','Ein mehrs\u00E4tziges Orchesterwerk von gro\u00DFem Ausma\u00DF','Ein Lied f\u00FCr Singstimme und Klavier','Eine Opernarie'],c:1,
   fb:['Das w\u00E4re eher ein Duo oder eine Sonate.','Genau! Sinfonien sind gro\u00DFe, mehrs\u00E4tzige Orchesterwerke &#8211; oft 4 S\u00E4tze, 30\u201360 Minuten lang.','Das w\u00E4re ein Kunstlied &#8211; eine andere Gattung.','Eine Arie ist Teil einer Oper, keine eigene Orchesterform.']},
  {type:'match',
   q:'Karim zieht vier Zettel aus einer Schublade. Links stehen die Gattungen, rechts die Beschreibungen. Ordne sie richtig zu.',
   left:['Symphonie','Kunstlied','Kammermusik','Oper'],
   right:['Gro\u00DFes mehrs\u00E4tziges Orchesterwerk','B\u00FChnenwerk mit S\u00E4ngern, Orchester und Handlung','Vertonung eines Gedichts f\u00FCr Stimme und Klavier','Musik f\u00FCr kleine Besetzung, z.B. Streichquartett'],
   c:[0,2,3,1]},
  {type:'quiz',
   q:'Lena findet eine Notiz: \u201EDas Kunstlied verbindet zwei Dinge.\u201C Was sind das?',
   opts:['Tanz und Gesang','Gedicht und Musik','Malerei und Rhythmus','Klavier und Geige'],c:1,
   fb:['Tanz und Gesang klingt nach Oper oder Musical.','Richtig! Im Kunstlied wird ein Gedicht durch Musik vertieft. Stimme und Klavier erz\u00E4hlen gemeinsam &#8211; eine neue Form der Romantik.','Malerei und Musik &#8211; interessant, aber das ist nicht die Definition des Kunstlieds.','Klavier und Geige w\u00E4re Kammermusik.']},
];}

function r3(){return[
  {type:'match',
   q:'An der Wand h\u00E4ngen Portr\u00E4ts. Links die Komponisten, rechts bekannte Werke. Ordne richtig zu.',
   left:['Franz Schubert','Fr\u00E9d\u00E9ric Chopin','Robert Schumann','Richard Wagner'],
   right:['Ring des Nibelungen (Oper)','Liederkreis','Die Unvollendete','Klavierballade g-Moll Nr.\u00A01'],
   c:[2,3,1,0]},
  {type:'quiz',
   q:'Karim h\u00E4lt ein Notenblatt hoch: \u201EIn der Fremde\u201C &#8211; ein Gedicht von Eichendorff. Wer hat es vertont?',
   opts:['Franz Schubert','Ludwig van Beethoven','Robert Schumann','Hector Berlioz'],c:2,
   fb:['Schubert hat viele Eichendorff-Gedichte vertont, aber \u201EIn der Fremde\u201C stammt von Schumann.','Beethoven hat kaum Kunstlieder geschrieben &#8211; er war vor allem Symphoniker.','Richtig! Robert Schumann vertonte \u201EIn der Fremde\u201C aus dem Liederkreis op.\u00A039 nach Eichendorff. Ein typisches romantisches Kunstlied.','Berlioz war Franzose &#8211; er hat keine deutschen Eichendorff-Gedichte vertont.']},
  {type:'hotspot',
   q:'Lena findet sechs Symbole auf einem Plakat. W\u00E4hle die drei Themen, die typisch f\u00FCr die Romantik sind:',
   items:[
     {e:'\u{1F332}',l:'Natur & Wald',ok:true},
     {e:'\u2696\uFE0F',l:'Symmetrie',ok:false},
     {e:'\u{1F494}',l:'Sehnsucht',ok:true},
     {e:'\u{1F3AD}',l:'M\u00E4rchen & Sage',ok:true},
     {e:'\u{1F4D0}',l:'Strenge Form',ok:false},
     {e:'\u{1F3DB}',l:'Hofzeremoniell',ok:false},
   ],n:3},
];}

function r4(){return[
  {type:'quiz',
   q:'Karim liest: \u201EWagner baute sein eigenes Haus f\u00FCr seine Opern.\u201C In welcher Stadt steht Wagners Festspielhaus?',
   opts:['M\u00FCnchen','Wien','Bayreuth','Berlin'],c:2,
   fb:['M\u00FCnchen hat eine enge Verbindung zu Wagner &#8211; K\u00F6nig Ludwig II. war sein F\u00F6rderer &#8211; aber das Festspielhaus steht woanders.','Wien ist die Hauptstadt der Klassik, nicht Wagners Festspielort.','Richtig! Wagner lie\u00DF in Bayreuth sein eigenes Festspielhaus bauen &#8211; eingeweiht 1876. Bis heute werden dort nur Wagners Opern aufgef\u00FChrt.','Berlin war nicht Wagners Wirkungsst\u00E4tte.']},
  {type:'quiz',
   q:'Lena findet ein altes Programmheft: \u201EDer Ring des Nibelungen\u201C. Wie viele Abende umfasst dieser Opernzyklus?',
   opts:['1 Abend','2 Abende','3 Abende','4 Abende'],c:3,
   fb:['Ein Abend w\u00E4re f\u00FCr den Ring viel zu kurz &#8211; allein ein Teil dauert mehrere Stunden.','Zwei Abende &#8211; noch nicht ganz.','Fast! Aber es sind vier Abende: ein Vorabend und drei Hauptteile.','Richtig! Der Ring besteht aus vier Teilen: Das Rheingold (Vorabend), Die Walk\u00FCre, Siegfried und G\u00F6tterd\u00E4mmerung. Aufgef\u00FChrt \u00FCber vier Abende.']},
  {type:'scenario',
   q:'Karim h\u00F6rt den Walk\u00FCrenritt. Lena fragt: Wie klingt das? Was beschreibt den Walk\u00FCrenritt am besten?',
   opts:[
     {t:'Option A: Sanft und melancholisch',d:'Leise, langsame Melodie &#8211; nachdenklich und traurig.',best:false,fb:'Das trifft nicht zu. Der Walk\u00FCrenritt ist laut, treibend und dramatisch &#8211; kein sanftes St\u00FCck.'},
     {t:'Option B: Kraftvoll und dramatisch',d:'Gro\u00DFes Orchester, treibender Rhythmus, Bilder von reitenden Kriegerinnen.',best:true,fb:'Genau! Der Walk\u00FCrenritt ist eines der bekanntesten Orchesterthemen \u00FCberhaupt &#8211; kraftvoll, treibend, mit einem unverwechselbaren Rhythmus.'},
     {t:'Option C: Verspielt und leicht',d:'Leichte Fl\u00F6ten, spielerische Melodie &#8211; wie ein Kinderlied.',best:false,fb:'Nein &#8211; Wagner wollte mit dem Walk\u00FCrenritt Macht, Kampf und Dramatik darstellen, keine Leichtigkeit.'},
   ]},
];}

function r5(){return[
  {type:'quiz',
   q:'Lena liest: \u201EDie Romantik ist eine Reaktion auf die Industrialisierung.\u201C Was meint das?',
   opts:['Komponisten schrieben Musik f\u00FCr Fabriken','Kunst und Musik zogen sich ins Private, in Natur und Gef\u00FChl zur\u00FCck','Musik wurde lauter, um den L\u00E4rm zu \u00FCbert\u00F6nen','Komponisten arbeiteten in Fabriken'],c:1,
   fb:['Musik f\u00FCr Fabriken &#8211; das w\u00E4re eine sehr moderne Idee, keine romantische.','Richtig! W\u00E4hrend die Welt l\u00E4rmend und politisch turbulent wurde, wandte sich Kunst nach innen: Sehnsucht, Natur, M\u00E4rchen, Gef\u00FChle.','Laut wird sp\u00E4ter Wagner &#8211; aber der Grund ist k\u00FCnstlerisch, nicht l\u00E4rmabweisend.','Das ist falsch &#8211; Komponisten waren K\u00FCnstler, keine Fabrikarbeiter.']},
  {type:'sort',
   q:'Karim findet eine Zeitleiste. Was geh\u00F6rt alles zur Romantik? Bringe diese vier Eigenschaften in eine sinnvolle Reihenfolge vom Allgemeinen zum Spezifischen:',
   items:['Musik dr\u00FCckt Gef\u00FChle aus','Zeit der Industrialisierung','Kunstlied und Oper bl\u00FChen auf','Wagner hebt die Oper auf neues Niveau'],
   c:[1,0,2,3],
   fb:['Gut! Von der geschichtlichen Epoche \u00FCber das \u00FCbergeordnete Merkmal zu den konkreten Gattungen bis zum einzelnen Komponisten.','Nicht ganz. Versuche: erst die Zeit (Industrialisierung), dann das allgemeine Merkmal (Gef\u00FChle), dann die Gattungen, dann das Spezifische (Wagner).']},
  {type:'quiz',
   q:'Die letzte Frage. Welcher Begriff beschreibt ein langes, mehrs\u00E4tziges Orchesterwerk &#8211; das gr\u00F6\u00DFte, was ein Komponist schreiben konnte?',
   opts:['Sonate','Kunstlied','Sinfonie','Nocturne'],c:2,
   fb:['Eine Sonate ist meist f\u00FCr ein oder zwei Instrumente &#8211; nicht f\u00FCr das gro\u00DFe Orchester.','Das Kunstlied ist f\u00FCr Stimme und Klavier &#8211; klein und intim.','Richtig! Die Sinfonie ist das gr\u00F6\u00DFte Orchesterwerk &#8211; vier S\u00E4tze, gro\u00DFes Ensemble, der H\u00F6hepunkt orchestraler Komposition.','Das Nocturne ist ein kurzes, n\u00E4chtliches Klavierst\u00FCck (Chopin) &#8211; kein Orchesterwerk.']},
];}

function getRoomTasks(r){return[r1,r2,r3,r4,r5][r]();}

var wmsg=[
  '\u201EHier drin liegt der Anfang. Die Romantik beginnt mit einer Epoche &#8211; und einem Gef\u00FChl. Kleiner Hinweis: Ich war dabei.\u201C',
  '\u201EJemand hat die Partitur zerrissen! Gattungen und Beschreibungen &#8211; alles durcheinander. Als ob das irgendjemanden \u00FCberrascht.\u201C',
  '\u201EAh, die Portr\u00E4ts meiner Kollegen. Ich sage nicht, wen ich mochte. Aber ich sage, wessen Musik ich kannte.\u201C',
  '\u201EWagner. Nat\u00FCrlich Wagner. Er hat immer alles gr\u00F6\u00DFer gemacht als n\u00F6tig. Ich war nicht eingeladen.\u201C',
  '\u201EDas letzte R\u00E4tsel. Ich schaue gespannt zu &#8211; zum ersten Mal seit 1847 wirklich gespannt.\u201C',
];
var pwmsg=[
  '\u201EDas Passwort ist das Gegenteil von Dur. Dunkel, schwer, geheimnisvoll.\u201C',
  '\u201EDer Name des gr\u00F6\u00DFten Opernkomponisten der Romantik. Er hat nie klein gedacht.\u201C',
  '\u201EGedicht plus Musik plus Klavier. Eine neue Gattung der Romantik. Wie hei\u00DFt sie?\u201C',
  '\u201EWo steht Wagners Festspielhaus? Eine Stadt in Bayern &#8211; bis heute sein Ort.\u201C',
  '\u201EEin langes, mehrs\u00E4tziges Orchesterwerk. Das Gr\u00F6\u00DFte, was ein Komponist schreiben kann.\u201C',
];
var hints=[
  'Das Gegenteil von Dur &#8211; die dunkle, schwere Tongeschlechtsbezeichnung.',
  'Vor- und Nachname des Komponisten von Tristan und Isolde &#8211; nur der Nachname.',
  'Gedicht + Musik + Klavier = diese neue romantische Gattung.',
  'Die Stadt in Bayern, die Wagner f\u00FCr sich gebaut hat.',
  'Ein langes Orchesterwerk mit mehreren S\u00E4tzen &#8211; das gr\u00F6\u00DFte Orchesterwerk \u00FCberhaupt.',
];

function render(){
  if(S.screen==='intro') renderIntro();
  else if(S.screen==='room') renderRoom();
  else if(S.screen==='pw') renderPw();
  else renderFinal();
}

function renderIntro(){
  var h='<div class="card">';
  h+='<div class="card-deco">\u266A\u266B\u266C</div>';
  h+='<div style="text-align:center;font-size:56px;margin:8px 0" class="glow">\u{1F3BB}</div>';
  h+='<h1>Die verschollene Sinfonie</h1>';
  h+='<h3 style="font-style:italic;color:var(--gold-dim);margin-bottom:20px">Ein Escape Room \u00FCber die Musik der Romantik</h3>';
  h+=maestro('\u201EEndlich jemand! Ich bin Maestro Moritz &#8211; Geist eines Komponisten, der hier seit 1847 feststeckt. Meine letzte Sinfonie wurde gestohlen und in f\u00FCnf Teilen versteckt. Jeder Teil liegt hinter einem R\u00E4tsel. Ohne euch ist sie f\u00FCr immer verloren. Na los &#8211; ich bin nicht j\u00FCnger geworden.\u201C');
  h+='<p>Das alte Konservatorium ist in der Nacht geschlossen. F\u00FCnf verschlossene R\u00E4ume. Nur wer die Musik der Romantik kennt, findet die Passw\u00F6rter.</p>';
  h+='<div class="orn">\u2756 \u2756 \u2756</div>';
  h+='<div class="char-row">';
  h+='<div class="char-card"><div class="char-emoji">\u{1F50D}</div><div class="char-name">Lena</div><div class="char-role">Neugierig, h\u00F6rt \u00FCberall hin &#8211; entdeckt Details, die andere \u00FCbersehen</div></div>';
  h+='<div class="char-card"><div class="char-emoji">\u{1F3B8}</div><div class="char-name">Karim</div><div class="char-role">Skeptisch, Hobby-Musiker &#8211; fragt immer: Aber warum eigentlich?</div></div>';
  h+='</div>';
  h+='<button class="btn btn-gold btn-full" onclick="startGame()">Die Nacht beginnt \u2014 Raum 1 betreten</button>';
  h+='</div>';
  root.innerHTML=h;
}

function startGame(){S.screen='room';S.room=0;S.step=0;S.td={};render();}

function renderRoom(){
  var room=ROOMS[S.room];
  var task=getRoomTasks(S.room)[S.step];
  var h=prog();
  h+='<div class="card">';
  h+='<div class="card-deco">'+room.deco+'</div>';
  h+='<div class="badge">Raum '+room.id+' &middot; '+room.sub+'</div>';
  h+='<h2>'+room.title+'</h2>';
  h+=maestro(wmsg[S.room]);
  h+='<div class="orn">\u2756</div>';
  h+='<div id="tw">'+renderTask(task)+'</div>';
  h+='</div>';
  root.innerHTML=h;
}

function renderTask(t){
  var td=S.td;
  if(t.type==='quiz'){
    var h='<h3>'+t.q+'</h3><div class="quiz-opts">';
    for(var i=0;i<t.opts.length;i++){
      var done=td.ans;
      var cls=done?(i===t.c?'qopt correct':(i===td.chosen?'qopt wrong':'qopt')):'qopt';
      h+='<button class="'+cls+'" '+(done?'disabled':'')+' onclick="ansQ('+i+')">'+t.opts[i]+'</button>';
    }
    h+='</div>';
    if(td.ans){
      var ok=td.chosen===t.c;
      h+='<div class="fb '+(ok?'ok':'err')+'">'+(ok?'&#10003; ':'&#10007; ')+t.fb[td.chosen]+'</div>';
      h+='<button class="btn btn-gold btn-full" onclick="nxt()">Weiter &#8594;</button>';
      if(ok&&!S.td.scored){S.rs[S.room]++;S.td.scored=true;}
    }
    return h;
  }
  if(t.type==='sort'){
    if(!td.si){td.si=[];for(var i=0;i<t.items.length;i++)td.si.push(i);}
    var h='<h3>'+t.q+'</h3><div class="sort-list" id="sl">';
    for(var p=0;p<td.si.length;p++){
      var idx=td.si[p];
      h+='<div class="sort-item" draggable="true" data-pos="'+p+'" ondragstart="dSt(event)" ondragover="dOv(event)" ondrop="dDr(event)" ondragleave="dLv(event)"><span class="sort-handle">&#9776;</span><span class="sort-num">'+(p+1)+'.</span><span>'+t.items[idx]+'</span></div>';
    }
    h+='</div>';
    if(td.sc){
      var ok=true;for(var i=0;i<td.si.length;i++){if(td.si[i]!==t.c[i]){ok=false;break;}}
      h+='<div class="fb '+(ok?'ok':'err')+'">'+(ok?'&#10003; '+t.fb[0]:'&#10007; '+t.fb[1])+'</div>';
      h+='<button class="btn btn-gold btn-full" style="margin-top:10px" onclick="nxt()">Weiter &#8594;</button>';
      if(ok&&!S.td.scored){S.rs[S.room]++;S.td.scored=true;}
    }else{
      h+='<button class="btn btn-gold" style="margin-top:8px" onclick="chkSort()">Reihenfolge pr\u00FCfen &#10003;</button>';
    }
    return h;
  }
  if(t.type==='match'){
    if(!td.ms)td.ms={sel:null,done:[],wrong:[]};
    var ms=td.ms;
    // shuffle right side once
    if(!td.sr){
      td.sr=[];for(var i=0;i<t.left.length;i++)td.sr.push(i);
      for(var i=td.sr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=td.sr[i];td.sr[i]=td.sr[j];td.sr[j]=tmp;}
    }
    var h='<h3>'+t.q+'</h3>';
    h+='<div class="match-wrap">';
    h+='<div class="match-heads"><div class="match-head">Begriff</div><div class="match-head">Beschreibung</div></div>';
    h+='<div class="match-grid">';
    // Interleaved: left[0]+right[0], left[1]+right[1], ...
    for(var i=0;i<t.left.length;i++){
      var pairedL=false;for(var k=0;k<ms.done.length;k++){if(ms.done[k].l===i){pairedL=true;break;}}
      var isSelL=ms.sel&&ms.sel.side==='l'&&ms.sel.i===i;
      var clsL=pairedL?'match-item ok':(isSelL?'match-item sel':'match-item');
      h+='<div class="'+clsL+'" onclick="mCl(\'l\','+i+')">'+t.left[i]+'</div>';
      var ri=td.sr[i];
      var pairedR=false;for(var m=0;m<ms.done.length;m++){if(ms.done[m].r===ri){pairedR=true;break;}}
      var isBad=ms.wrong.indexOf(ri)>=0;
      var isSelR=ms.sel&&ms.sel.side==='r'&&ms.sel.i===ri;
      var clsR=pairedR?'match-item ok':(isBad?'match-item bad':(isSelR?'match-item sel':'match-item'));
      h+='<div class="'+clsR+'" onclick="mCl(\'r\','+ri+')">'+t.right[ri]+'</div>';
    }
    h+='</div></div>';
    if(ms.done.length===t.left.length){
      var ok=true;for(var i=0;i<ms.done.length;i++){if(t.c[ms.done[i].l]!==ms.done[i].r){ok=false;break;}}
      h+='<div class="fb '+(ok?'ok':'err')+'">'+(ok?'&#10003; Alle Paare korrekt zugeordnet!':'&#10007; Nicht alle Paare stimmen &#8211; aber geschafft!')+'</div>';
      h+='<button class="btn btn-gold btn-full" style="margin-top:10px" onclick="nxt()">Weiter &#8594;</button>';
      if(ok&&!S.td.scored){S.rs[S.room]++;S.td.scored=true;}
    }
    return h;
  }
  if(t.type==='hotspot'){
    if(!td.hs)td.hs=[];
    var h='<h3>'+t.q+'</h3><p class="muted">W\u00E4hle genau '+t.n+' Elemente.</p><div class="hotspot-grid">';
    for(var i=0;i<t.items.length;i++){
      var item=t.items[i];
      var sel=td.hs.indexOf(i)>=0;
      var done=td.hd;
      var cls=done?(item.ok?'hcell ok':(sel?'hcell bad':'hcell')):(sel?'hcell sel':'hcell');
      h+='<div class="'+cls+'"'+(done?'':' onclick="tHot('+i+')"')+'><div style="font-size:28px">'+item.e+'</div><div class="hlabel">'+item.l+'</div></div>';
    }
    h+='</div>';
    if(td.hd){
      var sel=td.hs;
      var ok=sel.length===t.n;
      if(ok){for(var i=0;i<sel.length;i++){if(!t.items[sel[i]].ok){ok=false;break;}}}
      h+='<div class="fb '+(ok?'ok':'err')+'">'+(ok?'&#10003; Genau! Natur, Sehnsucht und M\u00E4rchen &amp; Sage &#8211; drei Kernthemen der Romantik.':'&#10007; Nicht ganz. Typisch romantisch: Natur &amp; Wald, Sehnsucht und M\u00E4rchen &amp; Sage.')+'</div>';
      h+='<button class="btn btn-gold btn-full" style="margin-top:10px" onclick="nxt()">Weiter &#8594;</button>';
      if(ok&&!S.td.scored){S.rs[S.room]++;S.td.scored=true;}
    }else{
      h+='<button class="btn btn-gold" '+(td.hs.length!==t.n?'disabled':'')+' onclick="chkHot()">Auswahl best\u00E4tigen &#10003;</button>';
    }
    return h;
  }
  if(t.type==='scenario'){
    var h='<h3>'+t.q+'</h3><div class="scen-list">';
    for(var i=0;i<t.opts.length;i++){
      var o=t.opts[i];
      var ch=td.sc2!==undefined;
      var cls='sopt'+(ch&&i===td.sc2&&o.best?' best':'');
      h+='<div class="'+cls+'"'+(ch?'':' onclick="choS('+i+')"')+'>';
      h+='<div class="sopt-title">'+o.t+'</div>';
      h+='<div class="sopt-desc">'+o.d+'</div>';
      if(ch&&i===td.sc2)h+='<div class="fb '+(o.best?'ok':'err')+'" style="margin-top:8px;padding:8px 12px;font-size:14px">'+(o.best?'&#10003;':'&#10007;')+' '+o.fb+'</div>';
      h+='</div>';
    }
    h+='</div>';
    if(td.sc2!==undefined)h+='<button class="btn btn-gold btn-full" onclick="nxt()">Weiter &#8594;</button>';
    return h;
  }
  return '';
}

// ACTIONS
function ansQ(i){S.td.ans=true;S.td.chosen=i;renderRoom();}
function dSt(e){e.dataTransfer.setData('text/plain',e.target.dataset.pos);e.target.classList.add('dragging');}
function dOv(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}
function dLv(e){e.currentTarget.classList.remove('drag-over');}
function dDr(e){
  e.preventDefault();
  var f=parseInt(e.dataTransfer.getData('text/plain')),t=parseInt(e.currentTarget.dataset.pos);
  if(f===t)return;
  var a=S.td.si.slice();var tmp=a[f];a[f]=a[t];a[t]=tmp;S.td.si=a;
  e.currentTarget.classList.remove('drag-over');
  document.querySelectorAll('.dragging').forEach(function(el){el.classList.remove('dragging');});
  renderRoom();
}
function chkSort(){S.td.sc=true;renderRoom();}
function mCl(side,i){
  var ms=S.td.ms;
  if(!ms)return;
  // check already matched
  for(var k=0;k<ms.done.length;k++){
    if(side==='l'&&ms.done[k].l===i)return;
    if(side==='r'&&ms.done[k].r===i)return;
  }
  if(!ms.sel){ms.sel={side:side,i:i};renderRoom();return;}
  if(ms.sel.side===side){ms.sel={side:side,i:i};renderRoom();return;}
  var l=side==='l'?i:ms.sel.i;
  var r2=side==='r'?i:ms.sel.i;
  ms.sel=null;
  ms.done.push({l:l,r:r2});
  ms.wrong=ms.wrong.filter(function(x){return x!==r2;});
  renderRoom();
}
function tHot(i){
  if(!S.td.hs)S.td.hs=[];
  var a=S.td.hs,idx=a.indexOf(i);
  if(idx>=0)a.splice(idx,1);else a.push(i);
  renderRoom();
}
function chkHot(){S.td.hd=true;renderRoom();}
function choS(i){
  var t=getRoomTasks(S.room)[S.step];
  S.td.sc2=i;
  if(t.opts[i].best&&!S.td.scored){S.rs[S.room]++;S.td.scored=true;}
  renderRoom();
}
function nxt(){
  var tasks=getRoomTasks(S.room);
  S.done[S.room]=1;
  if(S.step<tasks.length-1){S.step++;S.td={};renderRoom();}
  else{S.screen='pw';render();}
}

function renderPw(){
  var room=ROOMS[S.room];
  var used=S.hints[S.room];
  var h=prog();
  h+='<div class="card">';
  h+='<div class="card-deco">&#128272;</div>';
  h+='<h2>Passwort-Schloss</h2>';
  h+='<p>Alle R\u00E4tsel in <em>'+room.title+'</em> gel\u00F6st. Gib das Passwort ein.</p>';
  h+=maestro(pwmsg[S.room]);
  h+='<div class="pw-wrap">';
  h+='<p class="muted" style="font-family:Cinzel,serif;letter-spacing:3px;text-transform:uppercase;font-size:12px;margin-bottom:12px">Passwort eingeben</p>';
  h+='<div class="pw-row" id="pwr"></div>';
  h+='<div id="pwm"></div>';
  h+='</div>';
  h+='<div style="text-align:center;margin-top:12px">';
  h+='<button class="btn btn-outline btn-sm" onclick="tHint('+S.room+')">'+(used?'Tipp verbergen':'Tipp anzeigen')+'</button>';
  h+='<div class="pw-hint'+(used?' show':'')+'" id="hb">'+hints[S.room]+'</div>';
  h+='</div>';
  h+='<button class="btn btn-gold btn-full" style="margin-top:16px" onclick="chkPw()">Schloss \u00F6ffnen &#128275;</button>';
  h+='</div>';
  root.innerHTML=h;
  buildPw();
}
function buildPw(){
  var pw=ROOMS[S.room].pw,row=document.getElementById('pwr');
  if(!row)return;
  row.innerHTML='';
  for(var i=0;i<pw.length;i++){
    var inp=document.createElement('input');
    inp.type='text';inp.maxLength=1;inp.className='pw-l';inp.id='pl'+i;
    (function(idx){
      inp.addEventListener('input',function(e){
        e.target.value=e.target.value.toUpperCase().replace(/[^A-Z]/g,'');
        if(e.target.value&&idx<pw.length-1)document.getElementById('pl'+(idx+1)).focus();
      });
      inp.addEventListener('keydown',function(e){
        if(e.key==='Backspace'&&!e.target.value&&idx>0)document.getElementById('pl'+(idx-1)).focus();
      });
    })(i);
    row.appendChild(inp);
  }
  document.getElementById('pl0').focus();
}
function tHint(r){
  S.hints[r]=S.hints[r]?0:1;
  var box=document.getElementById('hb');
  var btn=document.querySelector('[onclick^="tHint"]');
  if(box)box.classList.toggle('show',!!S.hints[r]);
  if(btn)btn.textContent=S.hints[r]?'Tipp verbergen':'Tipp anzeigen';
}
function chkPw(){
  var pw=ROOMS[S.room].pw,val='';
  for(var i=0;i<pw.length;i++){var el=document.getElementById('pl'+i);if(el)val+=el.value;}
  var msg=document.getElementById('pwm');
  if(val.toUpperCase()===pw){
    if(msg)msg.innerHTML='<div class="pw-ok" style="font-family:Cinzel,serif;font-size:15px">&#10003; Korrekt! Der n\u00E4chste Raum \u00F6ffnet sich\u2026</div>';
    setTimeout(function(){
      if(S.room<ROOMS.length-1){S.room++;S.step=0;S.td={};S.screen='room';}
      else S.screen='final';
      render();
    },1100);
  }else{
    if(msg)msg.innerHTML='<div class="pw-err">&#10007; Das ist nicht richtig. Denk nochmal nach.</div>';
    document.querySelectorAll('.pw-l').forEach(function(el){
      el.style.borderColor='var(--error)';setTimeout(function(){el.style.borderColor='';},700);
    });
  }
}

function renderFinal(){
  var total=0;for(var i=0;i<S.rs.length;i++)total+=S.rs[i];
  var max=15,pct=Math.round(total/max*100);
  var stars=pct>=80?'&#11088;&#11088;&#11088;':(pct>=50?'&#11088;&#11088;':'&#11088;');
  var msg=pct>=80
    ?'\u201EUnglaublich. Ihr habt meine Sinfonie gerettet &#8211; und mich dazu. Ich werde jetzt endlich Ruhe finden. Aber zuerst: Danke. Von einem Geist zu Menschen, die auf Musik h\u00F6ren.\u201C'
    :(pct>=50
    ?'\u201ENicht schlecht. Ein paar Noten fehlen noch &#8211; aber die Sinfonie klingt wieder. Mit mehr \u00DCbung werdet ihr unschlagbar.\u201C'
    :'\u201EIhr habt es versucht. Meine Sinfonie ist noch etwas l\u00FCckenhaft. Aber immerhin bin ich jetzt weniger allein.\u201C');
  var h='<div class="card">';
  h+='<div class="final-icon">\u{1F3BB}</div>';
  h+='<div class="final-title">Die Sinfonie lebt wieder!</div>';
  h+=maestro(msg);
  h+='<div class="orn" style="font-size:26px;letter-spacing:12px">\u266A \u266B \u266C \u266D</div>';
  h+='<div class="stars">'+stars+'</div>';
  h+='<div class="score-badge">Wissen-Score: '+total+' / '+max+'</div>';
  h+='<p class="muted" style="text-align:center;margin-top:6px">'+pct+'% der Aufgaben korrekt gel\u00F6st</p>';
  h+='<div class="pw-summary">';
  h+='<div class="pw-sum-head">Passw\u00F6rter der Sinfonie</div>';
  for(var i=0;i<ROOMS.length;i++){
    h+='<div class="pw-sum-row">Raum '+ROOMS[i].id+': <span class="pw-sum-word">'+ROOMS[i].pw+'</span> \u2014 '+ROOMS[i].title+'</div>';
  }
  h+='</div>';
  h+='<button class="btn btn-gold btn-full" style="margin-top:16px" onclick="restart()">Nochmal spielen &#128260;</button>';
  h+='</div>';
  root.innerHTML=h;
}
function restart(){
  S={screen:'intro',room:0,rs:[0,0,0,0,0],step:0,td:{},hints:[0,0,0,0,0],done:[0,0,0,0,0]};
  render();
}

render();
</script>
</body>
</html>
